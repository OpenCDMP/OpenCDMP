spring:
  jpa:
    # Set explicitly: the services rely on the session staying open for the request, and leaving it to the
    # default makes Spring warn about it on every start.
    open-in-view: true
    properties:
      org:
        hibernate:
          flushMode: MANUAL
      hibernate:
        globally_quoted_identifiers: true
    hibernate:
      naming:
        physical-strategy: org.opencdmp.data.namingstrategy.PrefixPhysicalNamingStrategy
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      minimum-idle: 3
      maximum-pool-size: 10
      idle-timeout: 600000
      max-lifetime: 1800000
      # The authorization subqueries make PostgreSQL estimate most queries as expensive, so it JIT-compiles them for
      # far longer than they take to run.
      connection-init-sql: SET jit = off
  flyway:
    table: DBMigrationHistory
    # The schema is shared with the notification, annotation and KPI services, so a non-empty schema says nothing
    # about ours: baseline below every migration and let V01_00_010__Baseline tell a fresh database from a 1.2+ one.
    baseline-on-migrate: true
    baseline-version: 0
    validate-migration-naming: true

naming-strategy:
  prefix: 