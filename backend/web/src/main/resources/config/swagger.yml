springdoc:
  apiDocs:
    path: /api/v3/api-docs
    groups:
      enabled: ${SWAGGER_ENABLED:true}
  swaggerUi:
    path: /api/swagger-ui
    enabled: ${SWAGGER_ENABLED:true}
    useRootPath:  ${SWAGGER_ENABLED:true}
    docExpansion: none
    oauth2RedirectUrl: ${SWAGGER_AUTH_REDIRECT_URL}
    oauth:
      clientId: ${SWAGGER_AUTH_CLIENT_ID}
swagger-config:
  enabled: ${SWAGGER_ENABLED:true}
  serverUrl: ${SWAGGER_SERVER_URL}
  group:
    currentApi:
      group: current-api
      displayName: Current
      packagesToScan: org.opencdmp.controllers
      pathsToMatch: "/api/plan/**, /api/description/**, /api/description-template/**, /api/description-template-type/**, /api/plan-blueprint/**, /api/plan-blueprint-type/**, /api/entity-doi/**, /api/deposit/**, /api/file-transformer/**, /api/tag/**, /api/reference/**, /api/reference-type/**, /api/lock/**, /api/user/**, /api/principal/**, /api/evaluator/**, /api/plan-status/**, /api/description-status/**, /api/plan-workflow/**, /api/description-workflow/**, /api/tenant/**, /api/report/**, /api/webhook-subscription/**"
