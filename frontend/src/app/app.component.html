@if (!showOnlyRouterOutlet) {
  <ngx-guided-tour
    [skipText]="'GUIDED-TOUR.SKIP' | translate"
    [nextText]="'GUIDED-TOUR.NEXT' | translate"
    [doneText]="'GUIDED-TOUR.DONE' | translate"
  ></ngx-guided-tour>
}
<button class="skip-to-main-content" (click)="skipToMain()" tabindex="0">{{'ALT-TEXT.SKIP-TO-MAIN-CONTENT' | translate}}</button>
<div id="cookies-consent"></div>
@if (!showOnlyRouterOutlet) {
  <div class="wrapper">
    <app-navbar class="nav-bar"></app-navbar>
    <div class="main-container">
    <app-sidebar class="sidenav" [class.closed]="!sidenavService.isOpen()"></app-sidebar>
    <main id="main-page" tabindex="-1">
        @if (!authentication.appsNotAlreadyUserCreated()) {
        <router-outlet  (activate)='onActivate($event)' (deactivate)='onDeactivate($event)'></router-outlet>
        }
    </main>
    </div>
  </div>
}
@if (!showOnlyRouterOutlet && !authentication.appsNotAlreadyUserCreated()) {
  <app-notification></app-notification>
}
@if (showOnlyRouterOutlet && !authentication.appsNotAlreadyUserCreated()) {
  <router-outlet></router-outlet>
}
