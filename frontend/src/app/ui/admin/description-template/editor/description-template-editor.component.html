@if (formGroup) {
	<app-se2-editor-shell defaultIcon="inventory_2">
		@if (languageName) { <span se2HeaderChips class="bp2-tag bp2-tag--opt">{{languageName}}</span> }
		@if (languageName) { <span se2HeaderMeta> · {{languageName}}</span> }
		@if (usersArray.length) {
			<button se2HeaderChips type="button" class="bp2-pill bp2-pill--tag" (click)="setTab('details')"><mat-icon aria-hidden="true">group</mat-icon>{{'DESCRIPTION-TEMPLATE-EDITOR.EDITORS.COUNT' | bp2Count: usersArray.length }}</button>
		}
		@switch (tab) {
			@case ('details') { <app-dt2-details-tab /> }
			@case ('structure') { <app-bp2-structure-tab /> }
			@case ('review') { <app-dt2-review-tab /> }
		}
	</app-se2-editor-shell>
}
