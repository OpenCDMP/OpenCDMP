	@if (typeOptions.length) {
		<app-listing-filter-chip [label]="'DESCRIPTION-TEMPLATE-LISTING.FILTER.TYPE' | translate" [control]="internalFilters.controls.typeIds" [options]="typeOptions" [labelOf]="labelOfTypeIds" (changed)="applyFilters()" />
	}
</div>
