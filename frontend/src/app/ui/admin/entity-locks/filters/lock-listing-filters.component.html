<div class="al-filters">
	<app-listing-filter-chip [label]="'LOCK-LISTING.FILTER.TARGET-TYPE' | translate" [control]="internalFilters.controls.targetTypes" [options]="lockTargetTypeEnumValues" [labelOf]="labelOfTargetTypes" (changed)="applyFilters()" />
	<app-listing-filter-chip [label]="'ADMIN-LISTING.FILTERS.MORE' | translate" [control]="moreFiltersControl" [summary]="moreFiltersSummary" (applied)="applyFilters()">
		<mat-form-field class="w-100">
			<mat-label>{{'LOCK-LISTING.FILTER.USERS' | translate}}</mat-label>
			<app-multiple-auto-complete [formControl]="internalFilters.controls.userIds" [separatorKeysCodes]="separatorKeysCodes" [configuration]="userService.multipleAutocompleteConfiguration">
			</app-multiple-auto-complete>
		</mat-form-field>
	</app-listing-filter-chip>
</div>
