<ng-template #assetsBlock let-section><app-bp2-assets-block [section]="section" /></ng-template>
@if (formGroup) {
	<app-se2-editor-shell>
		@switch (tab) {
			@case ('details') { <app-bp2-details-tab /> }
			@case ('structure') { <app-bp2-structure-tab /> }
			@case ('review') { <app-bp2-review-tab /> }
		}
	</app-se2-editor-shell>
}
