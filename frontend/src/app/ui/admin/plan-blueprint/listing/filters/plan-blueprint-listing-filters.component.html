	@if (typeOptions.length) {
		<app-listing-filter-chip [label]="'PLAN-BLUEPRINT-LISTING.FILTER.TYPE' | translate" [control]="internalFilters.controls.typeIds" [options]="typeOptions" [labelOf]="labelOfTypeIds" (changed)="applyFilters()" />
	}
</div>
