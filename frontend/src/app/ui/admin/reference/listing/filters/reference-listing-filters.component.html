<div class="al-filters">
	<app-listing-filter-chip [label]="'REFERENCE-LISTING.FILTER.SOURCE-TYPE' | translate" [control]="internalFilters.controls.sourceTypes" [options]="referenceSourceTypeEnumValues" [labelOf]="labelOfSourceTypes" (changed)="applyFilters()" />
	<app-listing-filter-chip [label]="'ADMIN-LISTING.FILTERS.MORE' | translate" [control]="moreFiltersControl" [summary]="moreFiltersSummary" (applied)="applyFilters()">
		<mat-form-field class="w-100">
		            <mat-label>{{'REFERENCE-LISTING.FILTER.TYPE' | translate}}</mat-label>
		            <app-multiple-auto-complete [formControl]="internalFilters.controls.typeIds" placeholder="{{'REFERENCE-LISTING.FILTER.TYPE' | translate}}" [configuration]="referenceTypeService.multipleAutocompleteConfiguration">
		            </app-multiple-auto-complete>
		          </mat-form-field>
	</app-listing-filter-chip>
</div>
