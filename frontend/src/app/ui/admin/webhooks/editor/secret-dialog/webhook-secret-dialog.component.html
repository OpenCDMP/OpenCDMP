<div class="webhook-secret-dialog">
	<div mat-dialog-title class="d-flex align-items-center gap-half-rem">
		<mat-icon aria-hidden="true">key</mat-icon>
		<span>{{'WEBHOOK-EDITOR.SECRET-DIALOG.TITLE' | translate}}</span>
	</div>
	<div mat-dialog-content>
		<p>{{'WEBHOOK-EDITOR.SECRET-DIALOG.MESSAGE' | translate}}</p>
		<div class="secret-row">
			<code class="secret-value">{{data.secret}}</code>
			<button mat-icon-button (click)="copy()" [attr.aria-label]="'WEBHOOK-EDITOR.SECRET-DIALOG.COPY' | translate" [matTooltip]="'WEBHOOK-EDITOR.SECRET-DIALOG.COPY' | translate">
				<mat-icon aria-hidden="true">{{copied() ? 'check' : 'content_copy'}}</mat-icon>
			</button>
		</div>
		<p class="warning">{{'WEBHOOK-EDITOR.SECRET-DIALOG.WARNING' | translate}}</p>
	</div>
	<div mat-dialog-actions class="justify-content-end">
		<button mat-flat-button color="primary" (click)="close()">{{'WEBHOOK-EDITOR.SECRET-DIALOG.CLOSE' | translate}}</button>
	</div>
</div>
