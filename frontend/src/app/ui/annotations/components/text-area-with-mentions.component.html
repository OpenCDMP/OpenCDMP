<div class="relative-block-container w-100">
  <mat-form-field appearance="outline" class="w-100">
    @if(label){
        <mat-label>{{label | translate}}</mat-label>
    }
    <textarea
      [formControl]="internalForm"
      placeholder="{{(placeholder ?? 'ANNOTATION-DIALOG.THREADS.NEW-THREAD') | translate}}"
      class="w-100"
      rows="2"
      matInput
      appTextareaAutoresize
      #textareaRef
    ></textarea>
    <ngx-mentions [textInputElement]="textareaRef" style="position: absolute; left: 0;" class="w-100"
      [menuTemplate]="menuTemplate"
      [mentionsConfig]="mentionsConfig"
      [searchRegexp]="searchRegexp"
      [mentions]="mentions"
      [selectedChoices]="preselectedMentions"
      [removeWholeTagOnBackspace]="true"
      (search)="loadChoices($event)"
      (selectedChoicesChange)="onSelectedChoicesChange($event)"
      (menuShow)="onMenuShow()"
      (menuHide)="onMenuHide()"
    ></ngx-mentions>
    @if (internalForm.hasError('backendError')) {
      <mat-error>{{internalForm.getError('backendError')?.message}}</mat-error>
    }
    @if (internalForm.hasError('required')) {
      <mat-error>{{'COMMONS.VALIDATION.REQUIRED' | translate}}</mat-error>
    }
  </mat-form-field>

  <ng-template #menuTemplate
    let-selectChoice="selectChoice"
    >
    <div cdkOverlayOrigin #trigger="cdkOverlayOrigin">
      <ng-template
        cdkConnectedOverlay
        [cdkConnectedOverlayOrigin]="trigger"
        cdkConnectedOverlayOpen="true"
        >
        @if (choices) {
          <ngx-text-input-autocomplete-menu [choices]="choices"
            [getDisplayLabel]="getDisplayLabel"
            (selectChoice)="selectChoice($event)">
          </ngx-text-input-autocomplete-menu>
        }
      </ng-template>
    </div>
  </ng-template>
</div>
