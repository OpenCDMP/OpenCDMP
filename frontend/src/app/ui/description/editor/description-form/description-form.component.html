<div  class="dynamic-form-editor">
  @if (datasetDescription) {
    <div class="intro" [innerHTML]="datasetDescription"></div>
  }
  @if(descriptionTemplate && propertiesFormGroup){
        @for(section of descriptionTemplate.definition?.sections; track section; let i = $index){
            @if(visibilityRulesService.isVisibleMap[section.id]){
                <app-form-section
                    #formSection
                    [section]="section"
                    [canAnnotate]="canAnnotate"
                    [isNew]="isNew"
                    [canEdit]="canEdit"
                    [path]="(ordinal ? ordinal + '.' : '') + (i+1)"
                    [pathName]="'sections.'+i"
                    [propertiesFormGroup]="propertiesFormGroup"
                    [formGroup]="formGroup"
                    [descriptionId]="descriptionId()"
                    [planId]="planId()"
                    [visibilityRulesService]="visibilityRulesService"
                    [linkToScroll]="linkToScroll"
                    [validationErrorModel]="validationErrorModel"
                    [planUsers]="planUsers"
                    (askedToScroll)="onAskedToScroll(expansionPanel, $event)"
                ></app-form-section>
            }
        }
  }
</div>
