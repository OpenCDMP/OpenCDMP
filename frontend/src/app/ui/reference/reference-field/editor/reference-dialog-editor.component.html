<mat-dialog-content class="pt-4 reference-dialog-editor--content">
  <app-reference-manual-form
    [referenceTypeId]="data.referenceTypeId"
    [label]="label"
    [reference]="data.reference"
    [title]="(data.reference ? 'REFERENCE-FIELD.REFERENCE-DIALOG-EDITOR.EDIT-ENTRY' : 'REFERENCE-FIELD.REFERENCE-DIALOG-EDITOR.ADD-TITLE') | translate: {ReferenceTypeName: label}"
    (created)="onCreated($event)"
    (cancelled)="onCancelled()">
  </app-reference-manual-form>
</mat-dialog-content>
