<mat-form-field subscriptSizing="dynamic" [class.hidden-element]="(a$ | async) !== true && !inputValue"  (focusout)="onClose()" (focusin)="onOpen()">
	<input type="text" matInput [value]="inputValue" (keyup)="onKeyUp($event)" [attr.aria-label]="'HYBRID-LISTING.SEARCH' | translate">
	<button mat-icon-button matSuffix [disabled]="inputValue || (a$ | async)" [attr.aria-label]="'HYBRID-LISTING.SEARCH' | translate">
		<mat-icon aria-hidden="true">search</mat-icon>
	</button>
</mat-form-field>
