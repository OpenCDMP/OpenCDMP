<div class="container-fluid">
  <div class="row inapp-notification-listing">
    <div class="col-md-10 offset-md-1">

      <div class="mb-4 mt-4">
        <app-navigation-breadcrumb />
        <h4 class="mt-2">{{'NOTIFICATION-SERVICE.INAPP-NOTIFICATION-LISTING.TITLE' | translate}}</h4>
      </div>

      <app-admin-listing [rows]="gridRows" [columns]="gridColumns" [visibleColumns]="visibleColumns"
        [count]="totalElements" [offset]="currentPageNumber" [limit]="lookup.page.size"
        [defaultSort]="$safeNavigationMigration(lookup.order?.items)" [loadingIndicator]="isListingLoading" (rowActivated)="onRowActivated($event)"
        [hasActiveFilters]="hasActiveFilters" (clearFilters)="clearAllFilters()"
        (pageLoad)="alterPage($event)" (columnSort)="onColumnSort($event)"
        (columnsChanged)="onColumnsChanged($event)" [scope]="scope" [scopeCounts]="scopeCounts" (scopeChange)="onScopeChange($event)" [showDeleted]="showDeleted" (showDeletedChange)="onShowDeletedChange($event)" [searchTerm]="lookup.like" (searchChange)="onSearchChange($event)" [tenantName]="tenantName" [rowLink]="rowLink">

        <app-mine-inapp-notification-listing-filters listing-filters [(filter)]="lookup"
          (filterChange)="filterChanged($event)" />

          <app-user-settings-picker [key]="userSettingsKey" [userPreference]="lookup"
            (onSettingSelected)="changeSetting($event)" [autoSelectUserSettings]="autoSelectUserSettings"
            user-preference-settings />
          </app-admin-listing>

        </div>
      </div>
    </div>


            <ng-template #actions let-row="row" let-item>
              <div class="d-inline-block" (click)="$event.stopPropagation()">
                <button mat-icon-button [matMenuTriggerFor]="actionsMenu" [attr.aria-label]="'ALT-TEXT.MORE-ACTIONS' | translate">
                  <mat-icon>more_horiz</mat-icon>
                </button>
                <mat-menu #actionsMenu="matMenu">
                  <button mat-menu-item (click)="deleteType(row.id)">
                    <mat-icon aria-hidden="true">delete</mat-icon>
                    {{'NOTIFICATION-SERVICE.INAPP-NOTIFICATION-LISTING.ACTIONS.DELETE' | translate}}
                  </button>
                </mat-menu>
              </div>
            </ng-template>

            <ng-template #state let-row="row" let-item>
              <div class="row">
                <div class="col-auto">
                  @if (row.trackingState === notificationInAppTracking.Delivered) {
                    <mat-icon mat-list-icon>drafts</mat-icon>
                  }
                  @if (row.trackingState === notificationInAppTracking.Stored) {
                    <mat-icon mat-list-icon>mail</mat-icon>
                  }
                </div>
              </div>
            </ng-template>
